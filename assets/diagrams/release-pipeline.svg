<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="18" fill="none" stroke="#E2E8F0"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0F172A">Packaging: a build that has to prove it is the code it claims to be</text>
  <text x="40" y="72" font-size="14" fill="#64748B">Every gate fails the build or refuses the hand-over. None of them merely warns.</text>

  <g font-size="12.5" fill="#334155">
    <rect x="40" y="104" width="160" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="120" y="130" text-anchor="middle" font-weight="700" fill="#0F172A" font-size="14">1 · Fingerprint</text>
    <text x="54" y="156">purge cached bytecode</text>
    <text x="54" y="176">hash the app source</text>
    <text x="54" y="196">by content, not mtime</text>
    <text x="54" y="222" fill="#64748B" font-size="11.5">a stale-bytecode build</text>
    <text x="54" y="238" fill="#64748B" font-size="11.5">once passed every check</text>

    <rect x="232" y="104" width="160" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="312" y="130" text-anchor="middle" font-weight="700" fill="#0F172A" font-size="14">2 · Freeze</text>
    <text x="246" y="156">PyInstaller, one-dir</text>
    <text x="246" y="176">two executables,</text>
    <text x="246" y="196">one shared runtime</text>
    <text x="246" y="222" fill="#64748B" font-size="11.5">chosen by a 90-line probe,</text>
    <text x="246" y="238" fill="#64748B" font-size="11.5">not by survey</text>

    <rect x="424" y="104" width="160" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="504" y="130" text-anchor="middle" font-weight="700" fill="#0F172A" font-size="14">3 · Place model</text>
    <text x="438" y="156">model tree beside the</text>
    <text x="438" y="176">executables, not inside</text>
    <text x="438" y="196">the bundle</text>
    <text x="438" y="222" fill="#64748B" font-size="11.5">replaceable without</text>
    <text x="438" y="238" fill="#64748B" font-size="11.5">a rebuild</text>

    <rect x="616" y="104" width="160" height="150" rx="12" fill="#ECFDF5" stroke="#10B981"/>
    <text x="696" y="130" text-anchor="middle" font-weight="700" fill="#065F46" font-size="14">4 · Self-check</text>
    <text x="630" y="156">the artefact builds every</text>
    <text x="630" y="176">page off-screen, finds its</text>
    <text x="630" y="196">assets, model and child</text>
    <text x="630" y="222" fill="#047857" font-size="11.5">reports its fingerprint;</text>
    <text x="630" y="238" fill="#047857" font-size="11.5">mismatch = failed build</text>

    <rect x="808" y="104" width="160" height="150" rx="12" fill="#ECFDF5" stroke="#10B981"/>
    <text x="888" y="130" text-anchor="middle" font-weight="700" fill="#065F46" font-size="14">5 · Acceptance</text>
    <text x="822" y="156">Steps 1–4 run from the</text>
    <text x="822" y="176">frozen executables, with</text>
    <text x="822" y="196">real inference</text>
    <text x="822" y="222" fill="#047857" font-size="11.5">synthetic photos, a path</text>
    <text x="822" y="238" fill="#047857" font-size="11.5">with spaces, temp profile</text>

    <rect x="1000" y="104" width="160" height="150" rx="12" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="1080" y="130" text-anchor="middle" font-weight="700" fill="#92400E" font-size="14">6 · Release gate</text>
    <text x="1014" y="156">no model junction</text>
    <text x="1014" y="176">source unchanged since</text>
    <text x="1014" y="196">the build · self-check ok</text>
    <text x="1014" y="222" fill="#92400E" font-size="11.5">only then: VERSION.txt</text>
    <text x="1014" y="238" fill="#92400E" font-size="11.5">stamped into the folder</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="200" y1="179" x2="228" y2="179" marker-end="url(#a)"/>
    <line x1="392" y1="179" x2="420" y2="179" marker-end="url(#a)"/>
    <line x1="584" y1="179" x2="612" y2="179" marker-end="url(#a)"/>
    <line x1="776" y1="179" x2="804" y2="179" marker-end="url(#a)"/>
    <line x1="968" y1="179" x2="996" y2="179" marker-end="url(#a)"/>
  </g>
  <text x="40" y="294" font-size="12.5" fill="#475569">Result: a copy-and-run Windows folder — no installer, no admin rights, no Python, no console window, no local web server.</text>
</svg>
