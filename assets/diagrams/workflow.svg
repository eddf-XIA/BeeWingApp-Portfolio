<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="18" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#0F172A">From a raw specimen photograph to analysis-ready landmark coordinates</text>
  <text x="40" y="72" font-size="14" fill="#64748B">Four steps, each writing to its own output folder. Original photographs are only ever read.</text>

  <!-- Input -->
  <g filter="url(#sh)">
    <rect x="40" y="120" width="160" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  </g>
  <text x="120" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Raw photographs</text>
  <text x="120" y="172" text-anchor="middle" font-size="12.5" fill="#475569">one folder per species</text>
  <rect x="62" y="186" width="116" height="22" rx="5" fill="#E2E8F0"/>
  <text x="120" y="201" text-anchor="middle" font-size="12" fill="#334155" font-family="Consolas, Menlo, monospace">*_LF  *_RF</text>
  <rect x="62" y="214" width="116" height="22" rx="5" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="120" y="229" text-anchor="middle" font-size="12" fill="#94A3B8" font-family="Consolas, Menlo, monospace">*_FB  skipped</text>
  <text x="120" y="258" text-anchor="middle" font-size="11.5" fill="#64748B">read-only</text>

  <!-- Step 1 -->
  <g filter="url(#sh)">
    <rect x="240" y="110" width="200" height="170" rx="12" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="1.6"/>
  </g>
  <rect x="240" y="110" width="200" height="34" rx="12" fill="#0EA5A4"/>
  <rect x="240" y="130" width="200" height="14" fill="#0EA5A4"/>
  <text x="340" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">STEP 1 · Correct</text>
  <text x="340" y="170" text-anchor="middle" font-size="13" fill="#0F172A">Detect ArUco markers</text>
  <text x="340" y="190" text-anchor="middle" font-size="13" fill="#0F172A">Perspective warp to a</text>
  <text x="340" y="210" text-anchor="middle" font-size="13" fill="#0F172A">fixed-size square image</text>
  <text x="340" y="236" text-anchor="middle" font-size="12" fill="#475569">records mm-per-pixel scale</text>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="#475569">+ one metadata row per wing</text>
  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#0EA5A4" font-weight="600">background thread</text>

  <!-- Step 2 (exception branch) -->
  <g filter="url(#sh)">
    <rect x="240" y="318" width="200" height="82" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/>
  </g>
  <text x="340" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">STEP 2 · Fix by hand</text>
  <text x="340" y="363" text-anchor="middle" font-size="12.5" fill="#78350F">click 4 corners  TL → TR → BR → BL</text>
  <text x="340" y="383" text-anchor="middle" font-size="11.5" fill="#92400E">same warp, same metadata rules</text>

  <!-- Step 3 -->
  <g filter="url(#sh)">
    <rect x="520" y="110" width="200" height="170" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.6"/>
  </g>
  <rect x="520" y="110" width="200" height="34" rx="12" fill="#6366F1"/>
  <rect x="520" y="130" width="200" height="14" fill="#6366F1"/>
  <text x="620" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">STEP 3 · Standardize</text>
  <text x="620" y="170" text-anchor="middle" font-size="13" fill="#0F172A">Put every wing the</text>
  <text x="620" y="190" text-anchor="middle" font-size="13" fill="#0F172A">same way round</text>
  <text x="620" y="218" text-anchor="middle" font-size="12" fill="#475569">left wing → mirrored</text>
  <text x="620" y="237" text-anchor="middle" font-size="12" fill="#475569">right wing → rotated 180°</text>
  <text x="620" y="272" text-anchor="middle" font-size="11" fill="#6366F1" font-weight="600">background thread</text>

  <!-- Step 4 -->
  <g filter="url(#sh)">
    <rect x="800" y="110" width="200" height="170" rx="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
  </g>
  <rect x="800" y="110" width="200" height="34" rx="12" fill="#E11D48"/>
  <rect x="800" y="130" width="200" height="14" fill="#E11D48"/>
  <text x="900" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">STEP 4 · Analyse</text>
  <text x="900" y="170" text-anchor="middle" font-size="13" fill="#0F172A">Pose-estimation model</text>
  <text x="900" y="190" text-anchor="middle" font-size="13" fill="#0F172A">locates wing-vein</text>
  <text x="900" y="210" text-anchor="middle" font-size="13" fill="#0F172A">landmarks</text>
  <text x="900" y="236" text-anchor="middle" font-size="12" fill="#475569">DeepLabCut 3 · PyTorch</text>
  <text x="900" y="254" text-anchor="middle" font-size="12" fill="#475569">HRNet backbone · CPU</text>
  <text x="900" y="272" text-anchor="middle" font-size="11" fill="#E11D48" font-weight="600">isolated child process</text>

  <!-- Output -->
  <g filter="url(#sh)">
    <rect x="1040" y="120" width="130" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  </g>
  <text x="1105" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Results</text>
  <text x="1105" y="174" text-anchor="middle" font-size="12" fill="#475569">landmark CSV</text>
  <text x="1105" y="192" text-anchor="middle" font-size="12" fill="#475569">one row per wing</text>
  <text x="1105" y="210" text-anchor="middle" font-size="12" fill="#475569">x · y · likelihood</text>
  <text x="1105" y="236" text-anchor="middle" font-size="12" fill="#475569">metadata.csv</text>
  <text x="1105" y="254" text-anchor="middle" font-size="12" fill="#475569">specimen id map</text>

  <!-- Arrows main line -->
  <line x1="200" y1="195" x2="236" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="195" x2="516" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="478" y="186" text-anchor="middle" font-size="11" fill="#64748B">corrected</text>
  <line x1="720" y1="195" x2="796" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="758" y="186" text-anchor="middle" font-size="11" fill="#64748B">standardized</text>
  <line x1="1000" y1="195" x2="1036" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Exception branch arrows -->
  <path d="M 290 280 L 290 314" stroke="#B45309" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>
  <text x="280" y="302" text-anchor="end" font-size="11" fill="#B45309">markers not found</text>
  <path d="M 440 359 L 480 359 L 480 214 L 516 214" stroke="#B45309" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>
  <text x="488" y="300" font-size="11" fill="#B45309">rejoins</text>

  <!-- footer legend -->
  <text x="560" y="350" font-size="12.5" fill="#334155" font-weight="600">Why it is built this way</text>
  <text x="560" y="372" font-size="12" fill="#475569">• Steps 1, 3 and 4 keep running while the researcher works on another page.</text>
  <text x="560" y="391" font-size="12" fill="#475569">• Exceptions are routed to a human instead of silently dropped or silently guessed.</text>
</svg>
