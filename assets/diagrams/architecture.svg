<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="#E2E8F0"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#0F172A">Architecture: one GUI process, Qt-free science, an isolated inference process</text>
  <text x="40" y="72" font-size="14" fill="#64748B">Dependencies point downward only. The scientific pipeline never imports Qt; the window never imports PyTorch.</text>

  <!-- GUI process frame -->
  <rect x="30" y="94" width="790" height="520" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 5"/>
  <text x="50" y="118" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1">GUI PROCESS · BeeWingApp.exe (windowed)</text>

  <!-- Layer: pages -->
  <rect x="50" y="132" width="750" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="66" y="154" font-size="14" font-weight="700" fill="#0F172A">Presentation</text>
  <text x="66" y="173" font-size="12" fill="#64748B">QMainWindow · sidebar · QStackedWidget</text>
  <g font-size="12" fill="#334155">
    <rect x="330" y="146" width="80" height="26" rx="6" fill="#F1F5F9"/><text x="370" y="164" text-anchor="middle">Overview</text>
    <rect x="416" y="146" width="70" height="26" rx="6" fill="#F1F5F9"/><text x="451" y="164" text-anchor="middle">Folders</text>
    <rect x="492" y="146" width="66" height="26" rx="6" fill="#E6F6F6"/><text x="525" y="164" text-anchor="middle">Step 1</text>
    <rect x="564" y="146" width="66" height="26" rx="6" fill="#FEF3C7"/><text x="597" y="164" text-anchor="middle">Step 2</text>
    <rect x="636" y="146" width="66" height="26" rx="6" fill="#EEF2FF"/><text x="669" y="164" text-anchor="middle">Step 3</text>
    <rect x="708" y="146" width="66" height="26" rx="6" fill="#FFE4E6"/><text x="741" y="164" text-anchor="middle">Step 4</text>
  </g>
  <text x="66" y="200" font-size="11.5" fill="#64748B">pages built once, navigation is only an index change · QGraphicsView annotator · token-based QSS design system</text>

  <!-- Layer: controllers -->
  <rect x="50" y="230" width="750" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="66" y="252" font-size="14" font-weight="700" fill="#0F172A">Controllers</text>
  <text x="66" y="271" font-size="12" fill="#64748B">owned by the window, not the pages</text>
  <g font-size="12" fill="#334155">
    <rect x="330" y="244" width="104" height="26" rx="6" fill="#F1F5F9"/><text x="382" y="262" text-anchor="middle">Workspace</text>
    <rect x="440" y="244" width="94" height="26" rx="6" fill="#F1F5F9"/><text x="487" y="262" text-anchor="middle">Workflow</text>
    <rect x="540" y="244" width="72" height="26" rx="6" fill="#F1F5F9"/><text x="576" y="262" text-anchor="middle">Task ×3</text>
    <rect x="618" y="244" width="72" height="26" rx="6" fill="#F1F5F9"/><text x="654" y="262" text-anchor="middle">Manual</text>
    <rect x="696" y="244" width="84" height="26" rx="6" fill="#F1F5F9"/><text x="738" y="262" text-anchor="middle">Recovery</text>
  </g>
  <text x="66" y="298" font-size="11.5" fill="#64748B">duplicate-run refusal · generation counters drop stale results · folder-safety rules re-checked before any work</text>

  <!-- Layer: state + workers -->
  <rect x="50" y="328" width="368" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="66" y="350" font-size="14" font-weight="700" fill="#0F172A">Application state</text>
  <text x="66" y="374" font-size="12" fill="#334155">• workspace paths (validated, atomic save)</text>
  <text x="66" y="394" font-size="12" fill="#334155">• immutable, Qt-free workflow snapshot</text>
  <text x="66" y="414" font-size="12" fill="#334155">• per-step task state: progress, counts, log</text>
  <text x="66" y="434" font-size="12" fill="#334155">• manual queue, keyed by filename</text>

  <rect x="432" y="328" width="368" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="448" y="350" font-size="14" font-weight="700" fill="#0F172A">Background work</text>
  <text x="448" y="374" font-size="12" fill="#334155">• QThreadPool + QRunnable, three signals</text>
  <text x="448" y="394" font-size="12" fill="#334155">• jobs are plain Python, given a report() callable</text>
  <text x="448" y="414" font-size="12" fill="#334155">• exceptions become failure signals, never crashes</text>
  <text x="448" y="434" font-size="12" fill="#334155">• Step 4 job supervises a child process</text>

  <!-- Layer: pipeline -->
  <rect x="50" y="470" width="750" height="128" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="66" y="494" font-size="14" font-weight="700" fill="#065F46">Scientific pipeline — plain Python, no Qt</text>
  <text x="66" y="513" font-size="12" fill="#047857">the validated logic; shared unchanged with the original Streamlit app</text>
  <g font-size="12" fill="#065F46">
    <rect x="66" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="118" y="547" text-anchor="middle">discovery</text>
    <rect x="178" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="230" y="547" text-anchor="middle">folder safety</text>
    <rect x="290" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="342" y="547" text-anchor="middle">correction</text>
    <rect x="402" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="454" y="547" text-anchor="middle">standardize</text>
    <rect x="514" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="566" y="547" text-anchor="middle">analyze</text>
    <rect x="626" y="528" width="104" height="28" rx="6" fill="#D1FAE5"/><text x="678" y="547" text-anchor="middle">progress</text>
  </g>
  <text x="66" y="582" font-size="11.5" fill="#047857">OpenCV · NumPy · pandas — the desktop layer adds ordering, checks and reporting, never a second copy of the science</text>

  <!-- arrows between layers -->
  <line x1="425" y1="216" x2="425" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="234" y1="314" x2="234" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="616" y1="314" x2="616" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="616" y1="456" x2="616" y2="468" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Child process -->
  <rect x="860" y="94" width="310" height="300" rx="14" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/>
  <text x="880" y="120" font-size="12.5" font-weight="700" fill="#BE123C" letter-spacing="1">CHILD PROCESS</text>
  <text x="880" y="142" font-size="15" font-weight="700" fill="#0F172A">BeeWingAnalysis.exe (console)</text>
  <text x="880" y="170" font-size="12.5" fill="#334155">DeepLabCut 3 · PyTorch (CPU)</text>
  <text x="880" y="190" font-size="12.5" fill="#334155">pose-estimation model, loaded here only</text>
  <rect x="880" y="208" width="270" height="74" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/>
  <text x="894" y="230" font-size="12" font-weight="700" fill="#9F1239">private event channel</text>
  <text x="894" y="250" font-size="11.5" fill="#334155">real stdout duplicated before any import;</text>
  <text x="894" y="268" font-size="11.5" fill="#334155">library prints are redirected to stderr</text>
  <text x="880" y="306" font-size="12" fill="#334155">a crash or hang cannot take the window down</text>
  <text x="880" y="326" font-size="12" fill="#334155">cancel = terminate the process</text>
  <text x="880" y="346" font-size="12" fill="#334155">no import path inherited from the host</text>
  <text x="880" y="374" font-size="11.5" fill="#9F1239" font-weight="600">success is re-verified by the parent on disk</text>

  <line x1="802" y1="382" x2="856" y2="382" stroke="#E11D48" stroke-width="2" marker-end="url(#r)"/>
  <text x="829" y="400" text-anchor="middle" font-size="10.5" fill="#BE123C">spawn</text>
  <line x1="858" y1="350" x2="804" y2="350" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="829" y="342" text-anchor="middle" font-size="10.5" fill="#BE123C">events</text>

  <!-- Filesystem -->
  <rect x="860" y="414" width="310" height="200" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="880" y="440" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1">DISK — THE SOURCE OF TRUTH</text>
  <text x="880" y="466" font-size="12.5" fill="#334155">raw photographs ........ read-only</text>
  <text x="880" y="488" font-size="12.5" fill="#334155">corrected / standardized images</text>
  <text x="880" y="510" font-size="12.5" fill="#334155">metadata + specimen-id map (CSV)</text>
  <text x="880" y="532" font-size="12.5" fill="#334155">landmark results (CSV)</text>
  <text x="880" y="554" font-size="12.5" fill="#334155">folder config · per-user or portable</text>
  <text x="880" y="584" font-size="11.5" fill="#64748B">After a restart, state is rebuilt from here —</text>
  <text x="880" y="600" font-size="11.5" fill="#64748B">no UI position is ever persisted.</text>
  <line x1="800" y1="534" x2="856" y2="534" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
